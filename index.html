<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

            margin: 0;
            padding: 0;

            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fb;

        }
        .app-container {

<body>
<div class="app-container">
    <div class="header">
        <h1>📋 TaskAbr</h1>
        <button class="add-tab-btn" id="addTabBtn"><i class="fas fa-plus"></i> Tab</button>
    </div>
    <div class="tabs-scroll" id="tabsContainer"></div>
    
    <div class="filters-panel">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Cari...">
        </div>
        <div class="filter-select">
            <select id="filterStatusSelect">
                <option value="all">Semua</option>
                <option value="active">Aktif</option>
                <option value="completed">Selesai</option>
                <option value="cancelled">Batal</option>
            </select>
        </div>
        <div class="filter-select">
            <select id="filterTabSelect"></select>
        </div>
        <button id="resetFilterBtn" class="reset-filter" title="Reset filter"><i class="fas fa-undo-alt"></i></button>
    </div>
    
    <div id="tasksContainer"></div>
    <button class="add-task-btn" id="addTaskBtn" style="display: none;"><i class="fas fa-plus"></i></button>
</div>

<!-- Modal Task -->
<div id="taskModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2 id="modalTitle">Detail Tugas</h2>
        <input type="hidden" id="taskIdField">
        <input type="text" id="taskTitle" placeholder="Judul tugas">
        <textarea id="taskNotes" rows="2" placeholder="Catatan..."></textarea>
        <input type="datetime-local" id="taskDueDate">
        <div style="margin-bottom: 6px;">
            <label><i class="fas fa-calendar-plus"></i> Tanggal Pembuatan</label>
            <input type="datetime-local" id="taskCreatedAt" style="background:#ffffff;">
        </div>
        <label><i class="fas fa-flag"></i> Prioritas</label>
        <select id="taskPriority">
            <option value="low">Rendah</option>
            <option value="medium" selected>Sedang</option>
            <option value="high">Tinggi</option>
        </select>
        
        <div style="margin-bottom: 12px;">
            <label><i class="fas fa-exchange-alt"></i> Pindah ke tab</label>
            <select id="moveTabSelect"></select>
        </div>
        <div id="progressGroup">
            <label>Progres tugas:</label>
            <div class="range-group">
                <input type="range" id="progressSlider" min="0" max="100" step="1">
                <span id="progressPercent">0%</span>
            </div>
        </div>
        <div id="progressInfo" style="display:none; background:#eef2ff; border-radius:20px; padding:8px; margin:8px 0; font-size:0.75rem;"></div>
        <div id="completedInfo" style="display:none;" class="info-completed"></div>
        <h4><i class="fas fa-tasks"></i> Sub Tugas</h4>
        <div id="subtasksContainer" style="margin-bottom:10px;"></div>
        <div style="display:flex; gap:8px;">
            <input type="text" id="newSubtaskInput" placeholder="Nama sub tugas">
            <button id="addSubtaskBtn" class="btn-primary" style="padding:0 12px; flex:0;">+</button>
        </div>

        <!-- RENCANA ANGGARAN -->
        <div class="rab-section">
            <div class="rab-header">
                <h4><i class="fas fa-coins"></i> Rencana Anggaran</h4>
                <button id="toggleRabBtn" class="small-btn"><i class="fas fa-plus"></i> Tampilkan</button>
            </div>
            <div id="rabTableWrapper" style="display: none;">
                <table class="rab-table" id="rabTable">
                    <thead>
                        <tr><th>Uraian</th><th>Satuan</th><th>Harga Satuan</th><th>Jumlah</th><th></th></tr>
                    </thead>
                    <tbody id="rabTbody"></tbody>
                </table>
                <div style="margin-top: 6px; display: flex; justify-content: space-between; align-items: center;">
                    <button id="addRabRowBtn" class="small-btn"><i class="fas fa-plus"></i> Baris</button>
                    <div class="rab-total">Total: <span id="rabTotalDisplay">Rp 0</span></div>
                </div>
            </div>
        </div>

        <div class="modal-buttons" id="modalButtonsContainer"></div>
    </div>
</div>

<!-- Modal Tab -->
<div id="tabModal" class="modal">
    <div class="modal-content">
        <span class="close-tab-modal">&times;</span>
        <h2>Atur Tab</h2>
        <input type="hidden" id="tabIdField">
        <input type="text" id="tabName" placeholder="Nama tab">
        <div class="modal-buttons">
            <button id="saveTabBtn" class="btn-primary"><i class="fas fa-save"></i> Simpan</button>
            <button id="deleteTabBtn" class="btn-danger"><i class="fas fa-trash-alt"></i> Hapus</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, query, where, onSnapshot, Timestamp, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyDtryifWRdYyU8oMbB-l5bMhgnms0Y4K2w",
        authDomain: "task-bb3db.firebaseapp.com",
        projectId: "task-bb3db",
        storageBucket: "task-bb3db.firebasestorage.app",
        messagingSenderId: "227588110683",
        appId: "1:227588110683:web:be696631b12d00ab56027e"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    const tabsCol = collection(db, "tabs");
    const tasksCol = collection(db, "tasks");
    
    let currentTabId = 'high-priority-special';
    let tabsUnsub = null;
    let allTasksUnsub = null;
    let allTasksGlobal = [];
    let allTabs = [];
    
    // Elemen
    const tabsContainer = document.getElementById("tabsContainer");
    const addTabBtn = document.getElementById("addTabBtn");
    const tasksContainer = document.getElementById("tasksContainer");
    const addTaskBtn = document.getElementById("addTaskBtn");
    const taskModal = document.getElementById("taskModal");
    const tabModal = document.getElementById("tabModal");
    const closeModal = document.querySelector(".close-modal");
    const closeTabModal = document.querySelector(".close-tab-modal");
    const taskTitleInput = document.getElementById("taskTitle");
    const taskNotesInput = document.getElementById("taskNotes");
    const taskDueDate = document.getElementById("taskDueDate");
    const taskCreatedAtInput = document.getElementById("taskCreatedAt");
    const taskPrioritySelect = document.getElementById("taskPriority");
    const progressSlider = document.getElementById("progressSlider");
    const progressPercent = document.getElementById("progressPercent");
    const subtasksContainer = document.getElementById("subtasksContainer");
    const newSubtaskInput = document.getElementById("newSubtaskInput");
    const addSubtaskBtn = document.getElementById("addSubtaskBtn");
    const taskIdField = document.getElementById("taskIdField");
    const progressGroup = document.getElementById("progressGroup");
    const progressInfo = document.getElementById("progressInfo");
    const completedInfo = document.getElementById("completedInfo");
    const modalTitle = document.getElementById("modalTitle");
    const tabNameInput = document.getElementById("tabName");
    const tabIdField = document.getElementById("tabIdField");
    const saveTabBtn = document.getElementById("saveTabBtn");
    const deleteTabBtn = document.getElementById("deleteTabBtn");
    const modalButtonsContainer = document.getElementById("modalButtonsContainer");
    const moveTabSelect = document.getElementById("moveTabSelect");
    const filterStatusSelect = document.getElementById("filterStatusSelect");
    const filterTabSelect = document.getElementById("filterTabSelect");
    const resetFilterBtn = document.getElementById("resetFilterBtn");
    const searchInput = document.getElementById("searchInput");
    
    // Elemen RAB
    const toggleRabBtn = document.getElementById("toggleRabBtn");
    const rabTableWrapper = document.getElementById("rabTableWrapper");
    const rabTbody = document.getElementById("rabTbody");
    const addRabRowBtn = document.getElementById("addRabRowBtn");
    const rabTotalDisplay = document.getElementById("rabTotalDisplay");
    
    let activeTaskId = null;
    let currentSubtasks = [];
    let originalTabId = null;
    let currentRabItems = [];
    
    let openSection = null;
    
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
    
    function formatDate(timestamp) {
        if (!timestamp) return null;
        const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        return date.toLocaleString('id-ID', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    }
    
    // Helper untuk konversi Date ke string datetime-local (YYYY-MM-DDThh:mm)
    function toDatetimeLocal(date) {
        if (!date) return '';
        const d = new Date(date);
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const hours = String(d.getHours()).padStart(2, '0');
        const minutes = String(d.getMinutes()).padStart(2, '0');
        return `${year}-${month}-${day}T${hours}:${minutes}`;
    }
    
    function parseSatuanNumber(satuanStr) {
        if (!satuanStr) return 1;
        const match = satuanStr.match(/\d+(?:\.\d+)?/);
        if (match) return parseFloat(match[0]);
        return 1;
    }
    
    function formatRupiah(angka) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
    }
    
    function computeRabTotal(items) {
        return items.reduce((sum, item) => sum + (item.jumlah || 0), 0);
    }
    
    function recalcRabItem(item) {
        const qty = parseSatuanNumber(item.satuan);
        const harga = item.hargaSatuan || 0;
        const jumlah = qty * harga;
        return { ...item, jumlah };
    }
    
    function updateRabTotalDisplay() {
        const total = computeRabTotal(currentRabItems);
        rabTotalDisplay.textContent = formatRupiah(total);
    }
    
    function renderRabTable() {
        rabTbody.innerHTML = '';
        if (!currentRabItems.length) {

    function computeAvgProgressFromSubtasks(subtasks) {
        if (!subtasks || subtasks.length === 0) return null;
        const total = subtasks.reduce((sum, sub) => sum + (sub.progress || 0), 0);
        return Math.floor(total / subtasks.length);
    }
    
    async function updateTaskStatus(taskId, updates) { await updateDoc(doc(db, "tasks", taskId), updates); }
    
    async function toggleTaskCompletion(task) {
        if (task.cancelled) { await updateTaskStatus(task.id, { cancelled: false, completed: false, completedAt: null }); return; }
        if (task.completed) { await updateTaskStatus(task.id, { completed: false, progress: 0, completedAt: null }); return; }
        const subtasks = task.subtasks || [];
        if (subtasks.length > 0) {
            const allCompleted = subtasks.every(st => st.progress === 100);
            const newProgressValue = allCompleted ? 0 : 100;
            const newSubtasks = subtasks.map(st => ({ ...st, progress: newProgressValue }));
            const newAvgProgress = computeAvgProgressFromSubtasks(newSubtasks);
            const newCompleted = newSubtasks.every(st => st.progress === 100);
            const completedAtValue = newCompleted ? Timestamp.now() : null;
            await updateDoc(doc(db, "tasks", task.id), { subtasks: newSubtasks, progress: newAvgProgress, completed: newCompleted, cancelled: false, completedAt: completedAtValue });
        } else {
            await updateDoc(doc(db, "tasks", task.id), { progress: 100, completed: true, cancelled: false, completedAt: Timestamp.now() });
        }
    }

        const snap = await getDocs(q);
        snap.forEach(taskDoc => batch.delete(doc(db, "tasks", taskDoc.id)));

        await batch.commit();
    }

    function sortTasksByCreatedDate(tasks) {
        return [...tasks].sort((a, b) => {
            const dateA = a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate().getTime() : new Date(a.createdAt).getTime()) : 0;
            const dateB = b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate().getTime() : new Date(b.createdAt).getTime()) : 0;
            return dateB - dateA;
        });
    }
    
    function sortTasksByCompletedDate(tasks) {
        return [...tasks].sort((a, b) => {
            const dateA = a.completedAt ? (a.completedAt.toDate ? a.completedAt.toDate().getTime() : new Date(a.completedAt).getTime()) : 0;
            const dateB = b.completedAt ? (b.completedAt.toDate ? b.completedAt.toDate().getTime() : new Date(b.completedAt).getTime()) : 0;
            return dateB - dateA;
        });
    }
    
    function sortTasksByCancelledDate(tasks) {
        return sortTasksByCreatedDate(tasks);
    }

    function getProgressStyle(percent) {
        percent = Math.min(100, Math.max(0, percent));
        let r, g, b;
        if (percent <= 50) {
            r = 255;
            g = Math.floor(255 * (percent / 50));
            b = 0;
        } else {
            r = Math.floor(255 * (1 - (percent - 50) / 50));
            g = 255;
            b = 0;
        }
        const bgColor = `rgb(${r}, ${g}, ${b})`;
        const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        const textColor = luminance > 0.5 ? '#000000' : '#ffffff';
        return `background: ${bgColor}; color: ${textColor};`;
    }

        const classes = { high: 'priority-high', medium: 'priority-medium', low: 'priority-low' };
        return `<span class="priority-badge ${classes[p]}">${icons[p]} ${labels[p]}</span>`;
    }

    function renderSection(title, iconClass, tasks, sectionType, colorHex = null) {

    function toggleHandler(e) {
        const header = e.currentTarget;
        const sectionType = header.dataset.toggle;
        const container = header.parentElement.querySelector('.task-list-container');
        const icon = header.querySelector('.toggle-icon');
        if (openSection === sectionType) {
            container.style.display = 'none';
            icon.classList.add('collapsed');
            icon.classList.remove('fa-chevron-down');
            icon.classList.add('fa-chevron-right');
            openSection = null;
        } else {
            if (openSection) {
                const prevContainer = document.querySelector(`.task-section[data-section-type="${openSection}"] .task-list-container`);
                const prevIcon = document.querySelector(`.section-header[data-toggle="${openSection}"] .toggle-icon`);
                if (prevContainer) prevContainer.style.display = 'none';

                    prevIcon.classList.add('collapsed');
                    prevIcon.classList.remove('fa-chevron-down');
                    prevIcon.classList.add('fa-chevron-right');
                }
            }
            container.style.display = 'block';
            icon.classList.remove('collapsed');
            icon.classList.remove('fa-chevron-right');

                title, notes: taskNotesInput.value, dueDate: taskDueDate.value || null, progress: finalProgress, completed: finalCompleted, 
                subtasks: currentSubtasks, cancelled: false, completedAt: completedAtValue, priority: taskPrioritySelect.value,
                rabItems: currentRabItems, rabTotal: rabTotalFinal,
                createdAt: createdAtTimestamp
            };
            if (newTabId && newTabId !== originalTabId) updateData.tabId = newTabId;
            await updateDoc(doc(db, "tasks", activeTaskId), updateData);
            taskModal.style.display = "none";
        };
        modalButtonsContainer.appendChild(saveBtn);
    }
    
    function renderSubtasksModal() {
        subtasksContainer.innerHTML = '';
        if (!currentSubtasks.length) { subtasksContainer.innerHTML = '<div class="empty-placeholder">Belum ada sub-tugas.</div>'; }
        else {
            currentSubtasks.forEach((sub, idx) => {
                const div = document.createElement('div'); div.className = 'subtask-item'; 
                const subColor = getProgressColor(sub.progress || 0);
                div.innerHTML = `<div class="subtask-header"><span class="subtask-name">${escapeHtml(sub.text)}</span><i class="fas fa-trash-alt delete-subtask" data-idx="${idx}"></i></div><div class="subtask-range"><input type="range" class="subtask-progress" data-idx="${idx}" min="0" max="100" step="1" value="${sub.progress || 0}" style="accent-color: ${subColor};"><span class="subtask-percent" style="color: ${subColor};">${sub.progress || 0}%</span></div>`;
                subtasksContainer.appendChild(div);
            });
            document.querySelectorAll('.subtask-progress').forEach(slider => {
                slider.addEventListener('input', (e) => { const idx = parseInt(e.target.dataset.idx); let val = parseInt(e.target.value); const steps = [0,25,50,75,100]; const closest = steps.reduce((a,b) => Math.abs(b-val) < Math.abs(a-val) ? b : a); e.target.value = closest; currentSubtasks[idx].progress = closest; const percentSpan = e.target.parentElement.querySelector('.subtask-percent'); if (percentSpan) { percentSpan.innerText = `${closest}%`; percentSpan.style.color = getProgressColor(closest); } e.target.style.accentColor = getProgressColor(closest); updateMainProgressFromSubtasks(); });
            });
            document.querySelectorAll('.delete-subtask').forEach(btn => btn.addEventListener('click', () => { const idx = parseInt(btn.dataset.idx); currentSubtasks.splice(idx, 1); renderSubtasksModal(); if (currentSubtasks.length === 0) { progressGroup.style.display = 'block'; progressInfo.style.display = 'none'; progressSlider.disabled = false; const originalProgress = allTasksGlobal.find(t => t.id === activeTaskId)?.progress || 0; progressSlider.value = originalProgress; progressPercent.innerText = `${originalProgress}%`; } else { updateMainProgressFromSubtasks(); } }));
        }
        addSubtaskBtn.onclick = () => { const text = newSubtaskInput.value.trim(); if (!text) return alert("Isi nama sub-tugas"); currentSubtasks.push({ id: Date.now().toString(), text, progress: 0 }); newSubtaskInput.value = ''; renderSubtasksModal(); progressGroup.style.display = 'none'; progressInfo.style.display = 'block'; progressSlider.disabled = true; updateMainProgressFromSubtasks(); };
    }
    
    async function createNewTask(tabId) {
        if (!tabId) return alert("Pilih tab terlebih dahulu");
        const now = Timestamp.now();
        const newTask = { 
            tabId, title: "", notes: "", dueDate: null, progress: 0, completed: false, cancelled: false, subtasks: [], createdAt: now,
            completedAt: null, priority: "medium", rabItems: [], rabTotal: 0
        };
        const docRef = await addDoc(tasksCol, newTask);
        openTaskModal({ id: docRef.id, ...newTask });
    }
    
    function openTabModal(id = null, name = '') { tabIdField.value = id || ''; tabNameInput.value = name || ''; deleteTabBtn.style.display = id ? 'flex' : 'none'; tabModal.style.display = "flex"; }
    function closeAllModals() { taskModal.style.display = "none"; tabModal.style.display = "none"; }
    
    addTabBtn.addEventListener('click', () => openTabModal());
    saveTabBtn.addEventListener('click', async () => { const name = tabNameInput.value.trim(); if (!name) return alert("Nama tab tidak boleh kosong"); if (tabIdField.value) await updateTab(tabIdField.value, name); else await addNewTab(name); tabModal.style.display = "none"; });
    deleteTabBtn.addEventListener('click', async () => { if (tabIdField.value && confirm("Hapus tab dan semua tugas?")) { await deleteTabById(tabIdField.value); tabModal.style.display = "none"; } });
    addTaskBtn.addEventListener('click', () => { if (currentTabId === 'high-priority-special') { alert("Tidak bisa menambah tugas di tab Prioritas Tinggi. Pilih tab biasa terlebih dahulu."); return; } if (!currentTabId && allTabs.length > 0) currentTabId = allTabs[0].id; if (!currentTabId) alert("Buat tab terlebih dahulu"); else createNewTask(currentTabId); });
    closeModal.addEventListener('click', closeAllModals);
    closeTabModal.addEventListener('click', closeAllModals);
    window.onclick = (e) => { if (e.target === taskModal || e.target === tabModal) closeAllModals(); };
    searchInput.addEventListener('input', applyFiltersAndRender);
    filterStatusSelect.addEventListener('change', applyFiltersAndRender);
    filterTabSelect.addEventListener('change', () => { if (filterTabSelect.value !== 'all') { currentTabId = filterTabSelect.value; addTaskBtn.style.display = 'flex'; } else if (currentTabId !== 'high-priority-special') { currentTabId = 'high-priority-special'; addTaskBtn.style.display = 'none'; } applyFiltersAndRender(); renderTabs(allTabs); });
    resetFilterBtn.addEventListener('click', () => { searchInput.value = ''; filterStatusSelect.value = 'all'; if (currentTabId && currentTabId !== 'high-priority-special') filterTabSelect.value = currentTabId; else filterTabSelect.value = 'all'; applyFiltersAndRender(); });
    
    toggleRabBtn.addEventListener('click', () => {
        if (rabTableWrapper.style.display === 'none') {
            rabTableWrapper.style.display = 'block';
            if (currentRabItems.length === 0) addRabRow();
            else renderRabTable();
        } else {
            rabTableWrapper.style.display = 'none';
        }
    });
    addRabRowBtn.addEventListener('click', addRabRow);
    
    function getProgressColor(percent) {
        if (percent >= 80) return '#22c55e';
        if (percent >= 50) return '#f59e0b';
        if (percent >= 20) return '#f97316';
        return '#ef4444';
    }
    
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').then(reg => console.log('SW registered:', reg)).catch(err => console.log('SW error:', err)); }); }
    
    loadTabs();
    startGlobalTasksListener();
</script>
</body>
</html>
